# ============================================================================
# AYNI · Backend — CI
# Se ejecuta en cada push y pull request hacia main:
#   test   → uv sync --frozen + carga de la app + pytest
#   docker → valida que la imagen se construye (no la publica) y que arranca
# El despliegue vive en deploy.yml y solo corre si este workflow termina en verde.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv (misma versión que el Dockerfile)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Instalar Python y dependencias (uv.lock congelado)
        run: uv sync --frozen

      - name: Verificar que la API carga
        run: uv run python -c "from app.main import app; print('API cargada:', app.title)"

      - name: Ejecutar pruebas unitarias
        run: uv run pytest -q

  docker:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo valida que la imagen siga construyendo; el push lo hace
      # Render al recibir el deploy hook.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ayni-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar la imagen y comprobar /api/health (sin base de datos)
        run: |
          docker run -d --name ayni-ci -p 8000:8000 -e PORT=8000 ayni-backend:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; echo "Imagen OK"; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/health || { docker logs ayni-ci; exit 1; }
          docker rm -f ayni-ci
